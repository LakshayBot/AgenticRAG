name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false   # never cancel an in-flight deploy

jobs:
  deploy:
    name: Zero-Downtime Rolling Deploy
    runs-on: ubuntu-latest
    # Frontend is on Cloudflare Pages (auto-deploy on push to main) — no frontend job here.

    steps:
      # ── 1. Connect to private server via Tailscale ──────────────────────────
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # ── 2. Rolling deploy via SSH ────────────────────────────────────────────
      - name: Rolling deploy on production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}      # Tailscale IP of your server
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.PROD_REPO_DIR }}"

            # Pass DEPLOY_ENV so deploy.sh skips the interactive prompt,
            # and optionally pass SLACK_WEBHOOK for notifications.
            export DEPLOY_ENV=production
            export SLACK_WEBHOOK="${SLACK_WEBHOOK:-}"

            bash deploy.sh
